<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truth_Rail: Is this forward true?</title>
<meta name="description" content="Check forwarded messages, screenshots, voice notes, PDFs and links against trusted sources. Free, in English, Hindi and Marathi.">
<meta name="theme-color" content="#3c3489">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  :root{
    --bg:#faf9f5; --bg2:#f2f0fa; --fg:#25242a; --muted:#66656d; --card:#ffffff; --line:#e3e1d8; --line2:#d3d0c6;
    --accent:#3c3489; --accent-fg:#ffffff; --accent-soft:#eeedfe; --teal:#0f6e56;
    --ok:#12805f; --bad:#c9441c; --old:#a8650d; --part:#2b72bd; --unk:#6f6e68;
    --ok-bg:#e6f6f0; --bad-bg:#fdeee8; --old-bg:#fbf1df; --part-bg:#e7f0fb; --unk-bg:#efeeea;
    --warn-bg:#fff4e0; --warn-fg:#6b4000; --warn-line:#f0cf9a; --err-bg:#fdecea; --err-fg:#8a1f11; --err-line:#f1b5ac;
    --wa:#128c4a; --shadow:0 1px 2px rgba(20,18,50,.05),0 10px 30px rgba(60,52,137,.10); --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141318; --bg2:#1b1a24; --fg:#ecebe6; --muted:#a6a49c; --card:#201f26; --line:#34333c; --line2:#47454f;
      --accent:#b0aaf7; --accent-fg:#16151c; --accent-soft:#2a2845; --teal:#5dcaa5;
      --ok:#4cc79d; --bad:#f08460; --old:#e0a64a; --part:#6fb0f0; --unk:#a6a49c;
      --ok-bg:#16322a; --bad-bg:#3a211a; --old-bg:#372b14; --part-bg:#17293d; --unk-bg:#2a2a2d;
      --warn-bg:#3a2d12; --warn-fg:#f5d79b; --warn-line:#6b5420; --err-bg:#3a1b17; --err-fg:#f7b4a8; --err-line:#6a2e26;
      --wa:#25b865; --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141318; --bg2:#1b1a24; --fg:#ecebe6; --muted:#a6a49c; --card:#201f26; --line:#34333c; --line2:#47454f;
    --accent:#b0aaf7; --accent-fg:#16151c; --accent-soft:#2a2845; --teal:#5dcaa5;
    --ok:#4cc79d; --bad:#f08460; --old:#e0a64a; --part:#6fb0f0; --unk:#a6a49c;
    --ok-bg:#16322a; --bad-bg:#3a211a; --old-bg:#372b14; --part-bg:#17293d; --unk-bg:#2a2a2d;
    --warn-bg:#3a2d12; --warn-fg:#f5d79b; --warn-line:#6b5420; --err-bg:#3a1b17; --err-fg:#f7b4a8; --err-line:#6a2e26;
    --wa:#25b865; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html{font-size:100%;scroll-behavior:smooth;scroll-padding-top:76px}
  body{margin:0;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Nirmala UI",sans-serif}
  h1,h2,h3,p{margin-top:0}
  a{color:var(--accent)}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
  .hidden{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--accent-fg);padding:10px 14px;border-radius:10px;z-index:50;text-decoration:none}
  .skip:focus{top:10px}
  .i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
  .i.fill{fill:currentColor;stroke:none}

  /* ---------- header ---------- */
  .notice{background:var(--warn-bg);color:var(--warn-fg);border-bottom:1px solid var(--warn-line);padding:10px 0;font-size:.92rem}
  header.site{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
  .bar{display:flex;align-items:center;gap:12px;min-height:64px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.01em;color:var(--accent);text-decoration:none}
  .brand img{width:34px;height:34px;border-radius:9px}
  .nav{display:none;gap:4px;margin-left:18px}
  .nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem}
  .nav a:hover{background:var(--accent-soft);color:var(--accent)}
  .grow{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:0 12px;min-height:38px;font-size:.92rem;font-weight:600;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
  .icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--fg)}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .menu-wrap{position:relative}
  .menu{position:absolute;right:0;top:50px;width:min(300px,86vw);background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:14px;z-index:30}
  .menu h4{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .menu .group{display:flex;gap:6px;margin-bottom:14px}
  .menu .group button{flex:1;min-height:42px;border:1px solid var(--line2);background:var(--bg);border-radius:10px;font-weight:600}
  .menu .group button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid transparent;
    font-weight:700;text-decoration:none;font-size:1rem;background:var(--accent);color:var(--accent-fg)}
  .btn:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.wa{background:var(--wa);color:#fff}
  .btn.ghost{background:var(--card);color:var(--fg);border-color:var(--line2);font-weight:600}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
  .btn.sm{min-height:42px;padding:0 14px;font-size:.95rem;border-radius:12px}
  .btn.block{width:100%;min-height:54px;font-size:1.08rem}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;background:var(--card);padding:0 12px;min-height:36px;font-size:.88rem}

  /* ---------- hero ---------- */
  .hero{padding:28px 0 8px;background:radial-gradient(900px 340px at 12% -10%,var(--bg2),transparent 70%)}
  .hero .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-items:start}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;margin-bottom:14px}
  h1{font-size:clamp(1.9rem,6.4vw,3.1rem);line-height:1.1;letter-spacing:-.025em;margin-bottom:12px;font-weight:800}
  .lead{color:var(--muted);font-size:1.08rem;max-width:36em;margin-bottom:18px}
  .trust{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
  .trust li{display:flex;gap:10px;align-items:center;font-weight:600}
  .trust .badge{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);flex:none}
  .sample{display:none}
  .trust-chips{margin-top:14px}
  .hero-copy .trust{display:none}
  .hero .lead{margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .checker{padding:18px}
  .checker h2{font-size:1.15rem;margin:0 0 12px}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
  .tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:6px 2px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:.82rem;line-height:1.2;text-align:center}
  .tabs button .i{width:1.35em;height:1.35em}
  .tabs button[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  textarea{width:100%;min-height:150px;border:1px solid var(--line2);border-radius:14px;padding:14px;background:var(--bg);resize:vertical;font-size:1.04rem;line-height:1.5}
  textarea:focus{border-color:var(--accent)}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:170px;padding:20px;text-align:center;border:2px dashed var(--line2);border-radius:14px;background:var(--bg);color:var(--muted)}
  .drop .big{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
  .drop .big .i{width:26px;height:26px}
  .drop.over,.checker.over{border-color:var(--accent);background:var(--accent-soft)}
  .picked{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:14px;background:var(--bg)}
  .picked img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .picked .fileic{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
  .picked .meta{flex:1;min-width:0}
  .picked .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .picked .meta small{color:var(--muted)}
  .rm{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card)}
  .voice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border:1px solid var(--line2);border-radius:14px;background:var(--bg);text-align:center;min-height:170px;justify-content:center}
  .mic{position:relative;width:78px;height:78px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
  .mic .i{width:34px;height:34px}
  .mic.on{background:var(--bad);color:#fff}
  .mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);opacity:.5;animation:ring 1.2s ease-out infinite}
  @keyframes ring{from{transform:scale(.85);opacity:.7}to{transform:scale(1.2);opacity:0}}
  .bars{display:flex;gap:4px;height:22px;align-items:center}
  .bars span{width:4px;border-radius:2px;background:var(--bad);animation:bar 0.9s ease-in-out infinite}
  .bars span:nth-child(2n){animation-delay:.2s}.bars span:nth-child(3n){animation-delay:.4s}
  @keyframes bar{0%,100%{height:5px}50%{height:22px}}
  .timer{font-variant-numeric:tabular-nums;font-weight:700}
  .voice audio{width:100%;max-width:340px}
  .hint{color:var(--muted);font-size:.9rem}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .examples{margin-top:14px}
  .examples .hint{margin-right:2px}
  .go{margin-top:14px}
  .after{margin:10px 0 0;text-align:center}

  /* ---------- result ---------- */
  #result{margin-top:18px;scroll-margin-top:84px}
  #result:empty{display:none}
  .banner{display:flex;gap:14px;align-items:center;padding:18px;border-radius:var(--radius);border:1px solid;outline:none}
  .banner .ring{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;flex:none;color:#fff}
  .banner .ring .i{width:32px;height:32px}
  .banner h2{margin:0;font-size:1.3rem;line-height:1.25}
  .banner p{margin:2px 0 0;font-weight:600;font-size:.95rem}
  .b-Verified{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .b-Verified .ring{background:var(--ok)}
  .b-False{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)} .b-False .ring{background:var(--bad)}
  .b-Outdated{background:var(--old-bg);border-color:var(--old);color:var(--old)} .b-Outdated .ring{background:var(--old)}
  .b-Partly{background:var(--part-bg);border-color:var(--part);color:var(--part)} .b-Partly .ring{background:var(--part)}
  .b-Cannot{background:var(--unk-bg);border-color:var(--unk);color:var(--unk)} .b-Cannot .ring{background:var(--unk)}
  .banner h2{color:var(--fg)}
  .claim{margin-top:12px;padding:16px;border-left:6px solid var(--unk)}
  .c-Verified{border-left-color:var(--ok)}.c-False{border-left-color:var(--bad)}.c-Outdated{border-left-color:var(--old)}.c-Partly{border-left-color:var(--part)}.c-Cannot{border-left-color:var(--unk)}
  .claim .lab{display:flex;align-items:center;gap:8px;font-weight:800;margin:0 0 6px}
  .claim .lab.t-Verified{color:var(--ok)}.claim .lab.t-False{color:var(--bad)}.claim .lab.t-Outdated{color:var(--old)}.claim .lab.t-Partly{color:var(--part)}.claim .lab.t-Cannot{color:var(--unk)}
  .claim .q{color:var(--muted);margin:0 0 10px;font-size:.95rem;overflow-wrap:anywhere}
  .claim .why{margin:0 0 12px;font-size:1.06rem;overflow-wrap:anywhere}
  .srcs{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .src{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;text-decoration:none;color:var(--accent);font-weight:600;min-height:46px;overflow-wrap:anywhere}
  .src:hover{background:var(--accent-soft)}
  .src span{flex:1;min-width:0}
  .warn,.err{display:flex;gap:12px;margin-top:12px;padding:14px;border-radius:14px;border:1px solid}
  .warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-line)}
  .err{background:var(--err-bg);color:var(--err-fg);border-color:var(--err-line)}
  .warn .i,.err .i{margin-top:2px;width:1.4em;height:1.4em}
  .err details{margin-top:8px;font-size:.85rem}
  .err pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font:inherit;opacity:.9}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .fb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.95rem}
  .meta-line{color:var(--muted);font-size:.85rem;margin:10px 0 0}
  .progress{display:grid;gap:12px;padding:20px}
  .progress div{display:flex;align-items:center;gap:12px;color:var(--muted)}
  .progress .on{color:var(--fg);font-weight:700}
  .progress .done{color:var(--ok)}
  .spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--bg2),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* ---------- sections ---------- */
  section.sec{padding:44px 0 6px}
  .sec h2{font-size:clamp(1.45rem,4.4vw,2rem);letter-spacing:-.02em;margin-bottom:6px}
  .sec .sub{color:var(--muted);margin-bottom:22px;max-width:40em}
  .strip{margin-top:30px;padding:16px 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
  .strip h3{margin:0 0 10px;font-size:.88rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{padding:6px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:.88rem}
  .steps{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  .step{padding:20px}
  .step .n{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}
  .step .n .i{width:24px;height:24px}
  .step h3{margin:0 0 4px;font-size:1.1rem}
  .step p{margin:0;color:var(--muted)}
  .answers{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .ans{padding:16px;border-top:5px solid var(--unk)}
  .ans h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:1.02rem}
  .ans p{margin:0;color:var(--muted);font-size:.95rem}
  .wa-sec{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:24px;align-items:center}
  .wa-sec ol{margin:12px 0 18px;padding-left:1.2em;color:var(--muted)}
  .wa-sec li{margin:4px 0}
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;justify-self:center}
  .qrbox img{width:176px;height:176px;background:#fff;padding:8px;border-radius:16px;border:1px solid var(--line)}
  .hist{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .hist button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);min-height:54px}
  .hist .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist small{color:var(--muted)}
  .hist .i{width:1.4em;height:1.4em}
  .faq details{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;padding:0 16px}
  .faq summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-weight:700;cursor:pointer;list-style:none}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary .i{transition:transform .2s}
  .faq details[open] summary .i{transform:rotate(180deg)}
  .faq details p{margin:0 0 16px;color:var(--muted)}
  footer.site{margin-top:50px;border-top:1px solid var(--line);background:var(--card);padding:26px 0 calc(34px + env(safe-area-inset-bottom,0));color:var(--muted);font-size:.92rem}
  footer .cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  footer .brand{font-size:1.05rem}
  footer p{margin:0 0 6px}

  /* ---------- tablet and up ---------- */
  @media (min-width:640px){
    .answers{grid-template-columns:repeat(2,minmax(0,1fr))}
    .tabs button{flex-direction:row;gap:8px;font-size:.92rem}
    .tabs button .i{width:1.25em;height:1.25em}
    .wrap{padding:0 28px}
  }
  @media (min-width:800px){
    .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
    .wa-sec{grid-template-columns:minmax(0,1fr) auto;padding:32px 36px}
    footer .cols{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
  }
  @media (min-width:920px){ .nav{display:flex} }
  @media (min-width:1020px){
    .hero{padding:48px 0 14px}
    .hero .grid{grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:56px}
    .hero-copy{padding-top:12px;position:sticky;top:92px}
    .hero-copy .trust{display:grid}
    .trust-chips{display:none}
    .hero .lead{margin-bottom:18px}
    .sample{display:block;padding:18px;margin-top:6px;max-width:470px}
    .checker{padding:24px}
    .answers{grid-template-columns:repeat(5,minmax(0,1fr))}
  }
  @media (max-width:420px){
    .tabs{gap:2px}
    .tabs button{font-size:.74rem;padding:6px 1px}
    .wrap{padding:0 16px}
    .brand span{font-size:1.08rem}
    .seg button{padding:0 9px}
    .bar{gap:8px}
    .btn.hide-xs{display:none}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;scroll-behavior:auto !important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></symbol>

/* ---------- voice recording (WAV: works on every browser) ---------- */
function encodeWav(samples, rate){
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);

  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, samples.length * 2, true);

  return new Blob([buf], {type:"audio/wav"});
}
function downsample(data, from, to){

  for (let i = 0; i < out.length; i++){
    const a = Math.floor(i * ratio), b = Math.min(data.length, Math.floor((i + 1) * ratio)); let sum = 0;
    for (let j = a; j < b; j++) sum += data[j];
    out[i] = sum / Math.max(1, b - a);
  }
  return out;
}

async function submit(){

  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 90000);

    const r = await fetch("/api/check", {method:"POST", body:fd, signal:ctl.signal});
    const data = await r.json().catch(() => null);
    if (!r.ok || !data || !data.result) return showError((data && data.error) || (r.status >= 500 ? t("errServer") : t("errNet")),
